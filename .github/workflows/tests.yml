name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Unit tests
        run: pytest -q
      - name: Detector benchmark
        run: python redteam/benchmark_detectors.py
      - name: Red-team harness (worst-case, no LLM)
        run: python redteam/run_attacks.py --mode worst-case --all --fresh
      - name: Detection baselines
        run: python src/benchmark.py
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: |
            redteam/results/
            output/benchmark_results.md
